  <rect x="88" y="70" width="214" height="42" rx="21" fill="rgba(10,24,36,0.86)" stroke="#59e2ff" stroke-opacity="0.55"/>
  <text x="195" y="97" text-anchor="middle" font-family="Baloo 2, Arial" font-size="16" font-weight="800" fill="#eaf7ff">Level 1 · Coral Reef</text>

