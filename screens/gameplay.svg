  <circle cx="280" cy="39" r="9" fill="#ffd166" stroke="#c9932e" stroke-width="1.6"/>
  <text x="316" y="44" text-anchor="middle" font-family="Baloo 2, Arial" font-size="14" font-weight="800" fill="#eaf7ff">300</text>

