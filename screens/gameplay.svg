    <rect x="192" y="228" width="60" height="60" rx="13" fill="url(#glassC)" stroke="#59e2ff" stroke-width="3"/>
    <path d="M222 262c-9-7-11-14-1-19 3-2 1-6 1-6s-2 4-5 5c-6 2-6 11 5 20z" fill="#ffd166"/>
    <rect x="262" y="228" width="60" height="60" rx="13" fill="url(#glassC)" stroke="#59e2ff" stroke-width="3"/>
    <circle cx="292" cy="258" r="15" fill="none" stroke="#7ff3ff" stroke-width="3.5"/><circle cx="287" cy="253" r="2.5" fill="#7ff3ff"/>
