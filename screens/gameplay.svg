  <text x="190" y="583" text-anchor="middle" font-family="Baloo 2, Arial" font-size="15" font-weight="800" fill="#04222e">Combo x3</text>

  <!-- booster bar -->
  <g>
    <rect x="28" y="724" width="104" height="72" rx="20" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.15)"/>
    <path d="M56 744l14 0m-10-10l-6 6 6 6" stroke="#59e2ff" stroke-width="3" fill="none" stroke-linecap="round" transform="translate(14,6)"/>
    <text x="80" y="752" text-anchor="middle" font-family="Baloo 2, Arial" font-size="12" font-weight="800" fill="#eaf7ff">Undo</text>
    <rect x="54" y="760" width="52" height="20" rx="10" fill="rgba(143,230,164,0.18)"/>
    <text x="80" y="774" text-anchor="middle" font-size="10" font-weight="800" fill="#9ff3b1">FREE</text>
    <rect x="143" y="724" width="104" height="72" rx="20" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.15)"/>
    <path d="M173 748h8l6 10h-10zm0 24h8l4-8h-8z" fill="#59e2ff" transform="translate(12,-4)"/>
    <text x="195" y="752" text-anchor="middle" font-family="Baloo 2, Arial" font-size="12" font-weight="800" fill="#eaf7ff">Shuffle</text>
    <rect x="169" y="760" width="52" height="20" rx="10" fill="rgba(143,230,164,0.18)"/>
    <text x="195" y="774" text-anchor="middle" font-size="10" font-weight="800" fill="#9ff3b1">FREE</text>
    <rect x="258" y="724" width="104" height="72" rx="20" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.15)"/>
    <circle cx="310" cy="748" r="10" fill="none" stroke="#59e2ff" stroke-width="3"/>
    <path d="M306 752l4-6 4 6z" fill="#59e2ff"/>
    <text x="310" y="752" text-anchor="middle" font-family="Baloo 2, Arial" font-size="12" font-weight="800" fill="#eaf7ff">Hint</text>
    <rect x="284" y="760" width="52" height="20" rx="10" fill="rgba(255,209,102,0.16)"/>
    <text x="310" y="774" text-anchor="middle" font-size="10" font-weight="800" fill="#ffd166">75 ⬤</text>
  </g>
