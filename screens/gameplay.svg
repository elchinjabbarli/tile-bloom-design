    <rect x="27" y="611" width="44" height="44" rx="10" fill="url(#glassC)" stroke="#59e2ff" stroke-width="2.5"/>
    <ellipse cx="49" cy="633" rx="13" ry="8" fill="#7ff3ff"/>
    <rect x="79" y="611" width="44" height="44" rx="10" fill="url(#glassC)" stroke="#59e2ff" stroke-width="2.5"/>
    <ellipse cx="101" cy="633" rx="13" ry="8" fill="#7ff3ff"/>
    <rect x="131" y="611" width="44" height="44" rx="10" fill="url(#glassC)" stroke="#59e2ff" stroke-width="2.5"/>
    <path d="M153 619l5.5 11 12 1.8-8.6 8.4 2 12.2-10.4-5.5-10.4 5.5 2-12.2-8.6-8.4 12-1.8z" fill="#ffd166"/>
