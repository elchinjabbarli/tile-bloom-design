    <rect x="78" y="610" width="46" height="46" rx="10"/>
    <rect x="130" y="610" width="46" height="46" rx="10"/>
    <rect x="182" y="610" width="46" height="46" rx="10"/>
    <rect x="234" y="610" width="46" height="46" rx="10"/>
    <rect x="286" y="610" width="46" height="46" rx="10"/>
    <rect x="338" y="610" width="36" height="46" rx="10"/>
  </g>
  <!-- landed tiles in tray -->
