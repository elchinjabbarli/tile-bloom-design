    <rect x="52" y="308" width="60" height="60" rx="13" fill="url(#glassC)" stroke="#59e2ff" stroke-width="3"/>
    <path d="M64 338h36l-5 12h-26z" fill="#ffb84d"/><circle cx="82" cy="332" r="8" fill="#ffe3a3"/><circle cx="82" cy="328" r="2.4" fill="#c9932e"/>
    <rect x="192" y="308" width="60" height="60" rx="13" fill="url(#glassC)" stroke="#59e2ff" stroke-width="3"/>
    <circle cx="222" cy="338" r="15" fill="#8ad7ff"/><circle cx="215" cy="333" r="3.2" fill="#123"/><circle cx="228" cy="333" r="3.2" fill="#123"/>
    <!-- row 4 -->
    <rect x="122" y="400" width="60" height="60" rx="13" fill="url(#glassC)" stroke="#59e2ff" stroke-width="3"/>
    <path d="M152 412c-8 2-13 9-11 17 1 5 5 9 11 9s10-4 11-9c2-8-3-15-11-17z" fill="#ff6f91"/>
