<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" font-family="Nunito, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d4a6e"/>
      <stop offset="0.55" stop-color="#072c47"/>
      <stop offset="1" stop-color="#041420"/>
    </linearGradient>
    <linearGradient id="glassC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(127,243,255,0.30)"/>
      <stop offset="1" stop-color="rgba(127,243,255,0.12)"/>
    </linearGradient>
  </defs>
  <rect width="390" height="844" fill="url(#bg)"/>

  <!-- HUD -->
  <rect x="14" y="16" width="46" height="46" rx="15" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.16)"/>
  <rect x="24" y="28" width="6" height="22" rx="3" fill="#eaf7ff"/>
  <rect x="36" y="28" width="6" height="22" rx="3" fill="#eaf7ff"/>
  <rect x="72" y="21" width="88" height="36" rx="18" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.14)"/>
  <text x="116" y="45" text-anchor="middle" font-family="Baloo 2, Arial" font-size="14" font-weight="800" fill="#59e2ff">Level 1</text>
  <rect x="168" y="21" width="86" height="36" rx="18" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.14)"/>
  <text x="176" y="34" font-size="9" font-weight="800" letter-spacing="1.5" fill="rgba(234,247,255,0.62)">SCORE</text>
