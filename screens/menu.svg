<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" font-family="Nunito, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d4a6e"/>
      <stop offset="0.55" stop-color="#072c47"/>
      <stop offset="1" stop-color="#041420"/>
    </linearGradient>
    <linearGradient id="logoG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf7ff"/>
      <stop offset="0.6" stop-color="#59e2ff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="btnG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8beaff"/>
      <stop offset="1" stop-color="#2f9ecf"/>
    </linearGradient>
    <radialGradient id="bub" cx="0.35" cy="0.28" r="0.9">
      <stop offset="0" stop-color="rgba(255,255,255,0.24)"/>
      <stop offset="1" stop-color="rgba(255,255,255,0.02)"/>
    </radialGradient>
  </defs>
  <rect width="390" height="844" fill="url(#bg)"/>

  <!-- ambient -->
  <g opacity="0.35" stroke="#bef4ff" fill="none">
    <circle cx="60" cy="120" r="9" stroke-width="3"/>
    <circle cx="330" cy="200" r="6" stroke-width="2.5"/>
    <circle cx="310" cy="700" r="12" stroke-width="3"/>
    <circle cx="80" cy="640" r="5" stroke-width="2"/>
  </g>

  <!-- decorative corner tiles -->
  <g opacity="0.5">
    <rect x="18" y="70" width="52" height="52" rx="12" fill="rgba(127,243,255,0.16)" stroke="#59e2ff" stroke-width="3"/>
    <circle cx="44" cy="96" r="7" fill="#7ff3ff"/>
    <rect x="318" y="100" width="58" height="58" rx="13" fill="rgba(255,209,102,0.16)" stroke="#ffd166" stroke-width="3"/>
    <path d="M347 122l6 12 13 2-9.5 9 2.3 13-11.8-6.2-11.8 6.2 2.3-13-9.5-9 13-2z" fill="#ffd166"/>
    <rect x="30" y="690" width="46" height="46" rx="11" fill="rgba(255,143,163,0.16)" stroke="#ff8fa3" stroke-width="3"/>
    <circle cx="53" cy="713" r="6" fill="#ff8fa3"/>
    <circle cx="41" cy="720" r="5" fill="#ff8fa3"/>
    <circle cx="65" cy="720" r="5" fill="#ff8fa3"/>
  </g>

  <!-- logo -->
  <text x="195" y="180" text-anchor="middle" font-family="Baloo 2, Arial Rounded MT Bold, Arial" font-size="52" font-weight="800" fill="url(#logoG)">Tile Bloom</text>
  <text x="197" y="208" text-anchor="middle" font-size="11" font-weight="800" letter-spacing="6" fill="rgba(234,247,255,0.8)">TRIPLE MATCH PUZZLE</text>

  <!-- mascot Bloomie -->
  <g transform="translate(195, 390)">
    <circle r="93" fill="url(#bub)" stroke="#59e2ff" stroke-width="3"/>
    <g fill="#59e2ff">
      <ellipse cx="0" cy="-52" rx="11" ry="17" transform="rotate(-72 0 0)"/>
      <ellipse cx="0" cy="-52" rx="11" ry="17" transform="rotate(-36 0 0)"/>
      <ellipse cx="0" cy="-52" rx="11" ry="17"/>
      <ellipse cx="0" cy="-52" rx="11" ry="17" transform="rotate(36 0 0)"/>
      <ellipse cx="0" cy="-52" rx="11" ry="17" transform="rotate(72 0 0)"/>
    </g>
    <circle r="23" fill="#f6fdff"/>
    <circle cx="-9" cy="-4" r="4.6" fill="#14303c"/>
    <circle cx="9" cy="-4" r="4.6" fill="#14303c"/>
    <circle cx="-10.5" cy="-5.5" r="1.6" fill="#fff"/>
    <circle cx="7.5" cy="-5.5" r="1.6" fill="#fff"/>
    <path d="M-8 7 Q0 14 8 7" stroke="#14303c" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <ellipse cx="-16" cy="5" rx="5" ry="3" fill="rgba(255,130,150,0.42)"/>
    <ellipse cx="16" cy="5" rx="5" ry="3" fill="rgba(255,130,150,0.42)"/>
    <path d="M0 -23 Q0 -35 5 -40" stroke="#2f7d4f" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <ellipse cx="-5" cy="-41" rx="6" ry="3.4" fill="#57c47a" transform="rotate(-24 -5 -41)"/>
    <ellipse cx="7" cy="-42" rx="6" ry="3.4" fill="#57c47a" transform="rotate(20 7 -42)"/>
  </g>

  <!-- chapter chip -->
  <rect x="92" y="530" width="206" height="40" rx="20" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.14)"/>
  <text x="195" y="556" text-anchor="middle" font-size="14" font-weight="800" fill="#59e2ff">Coral Reef · Level 1</text>

  <!-- play -->
  <rect x="105" y="594" width="180" height="62" rx="22" fill="url(#btnG)"/>
  <text x="195" y="633" text-anchor="middle" font-family="Baloo 2, Arial" font-size="21" font-weight="700" fill="#04222e">▶ Play</text>

  <!-- secondary row -->
  <rect x="110" y="676" width="120" height="48" rx="16" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.16)"/>
  <text x="170" y="706" text-anchor="middle" font-size="15" font-weight="700" fill="#eaf7ff">How to play</text>
  <rect x="244" y="676" width="48" height="48" rx="16" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.16)"/>
  <circle cx="268" cy="698" r="9" fill="none" stroke="#eaf7ff" stroke-width="2.4"/>
  <circle cx="268" cy="698" r="3.6" fill="#eaf7ff"/>

  <!-- stats -->
  <text x="158" y="766" text-anchor="middle" font-size="15" font-weight="800" fill="rgba(234,247,255,0.62)">★ 0</text>
  <text x="232" y="766" text-anchor="middle" font-size="15" font-weight="800" fill="rgba(234,247,255,0.62)">⬤ 300</text>
  <text x="195" y="800" text-anchor="middle" font-size="11" fill="rgba(234,247,255,0.35)" letter-spacing="2">V1.0.0</text>
</svg>
