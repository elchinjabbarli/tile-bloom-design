<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" font-family="Nunito, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d4a6e"/>
      <stop offset="1" stop-color="#041420"/>
    </linearGradient>
    <radialGradient id="bub" cx="0.35" cy="0.28" r="0.9">
      <stop offset="0" stop-color="rgba(255,255,255,0.24)"/>
      <stop offset="1" stop-color="rgba(255,255,255,0.02)"/>
    </radialGradient>
    <linearGradient id="goldG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe3a3"/>
      <stop offset="1" stop-color="#ffb84d"/>
    </linearGradient>
  </defs>
  <rect width="390" height="844" fill="url(#bg)"/>
  <!-- dimmed gameplay hint -->
  <g opacity="0.14">
    <rect x="60" y="180" width="56" height="56" rx="12" fill="rgba(127,243,255,0.2)" stroke="#59e2ff" stroke-width="2"/>
    <rect x="150" y="180" width="56" height="56" rx="12" fill="rgba(127,243,255,0.2)" stroke="#59e2ff" stroke-width="2"/>
    <rect x="240" y="180" width="56" height="56" rx="12" fill="rgba(127,243,255,0.2)" stroke="#59e2ff" stroke-width="2"/>
    <rect x="70" y="560" width="250" height="60" rx="14" fill="rgba(255,255,255,0.05)" stroke="#ff5a5a" stroke-opacity="0.4"/>
  </g>
  <rect width="390" height="844" fill="rgba(2,10,16,0.5)"/>

  <rect x="35" y="190" width="320" height="440" rx="30" fill="rgba(10,24,36,0.86)" stroke="#59e2ff" stroke-opacity="0.45"/>

  <!-- sad Bloomie -->
  <g transform="translate(195, 300)">
    <circle r="58" fill="url(#bub)" stroke="#59e2ff" stroke-width="2.5"/>
    <g fill="#59e2ff" opacity="0.55">
      <ellipse cx="0" cy="-33" rx="7" ry="11" transform="rotate(-72 0 0)"/>
      <ellipse cx="0" cy="-33" rx="7" ry="11" transform="rotate(-36 0 0)"/>
      <ellipse cx="0" cy="-33" rx="7" ry="11"/>
      <ellipse cx="0" cy="-33" rx="7" ry="11" transform="rotate(36 0 0)"/>
      <ellipse cx="0" cy="-33" rx="7" ry="11" transform="rotate(72 0 0)"/>
    </g>
    <circle r="15" fill="#f6fdff"/>
    <circle cx="-6" cy="-3" r="3" fill="#14303c"/>
    <circle cx="6" cy="-3" r="3" fill="#14303c"/>
    <path d="M-6 8 Q0 2 6 8" stroke="#14303c" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <ellipse cx="-11" cy="4" rx="3.4" ry="2.2" fill="rgba(255,130,150,0.42)"/>
    <ellipse cx="11" cy="4" rx="3.4" ry="2.2" fill="rgba(255,130,150,0.42)"/>
  </g>

  <text x="195" y="420" text-anchor="middle" font-family="Baloo 2, Arial" font-size="25" font-weight="800" fill="#eaf7ff">Tray full!</text>
  <text x="195" y="448" text-anchor="middle" font-size="15" fill="rgba(234,247,255,0.62)">No space left in the tray.</text>

  <!-- continue (rewarded) -->
  <rect x="70" y="480" width="250" height="56" rx="18" fill="url(#goldG)"/>
  <text x="160" y="515" text-anchor="middle" font-family="Baloo 2, Arial" font-size="16" font-weight="700" fill="#3d2504">▶ Continue</text>
  <rect x="266" y="493" width="40" height="30" rx="15" fill="rgba(61,37,4,0.35)"/>
  <text x="286" y="514" text-anchor="middle" font-size="13" font-weight="900" fill="#3d2504">8</text>

  <rect x="70" y="552" width="250" height="56" rx="18" fill="#59e2ff"/>
  <text x="195" y="587" text-anchor="middle" font-family="Baloo 2, Arial" font-size="16" font-weight="700" fill="#04222e">Retry</text>
  <rect x="70" y="620" width="250" height="56" rx="18" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.16)"/>
  <text x="195" y="655" text-anchor="middle" font-family="Baloo 2, Arial" font-size="16" font-weight="700" fill="#eaf7ff">Home</text>
</svg>
